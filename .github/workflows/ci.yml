name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints/ci-python311-linux.txt

      - name: Install constrained dependencies
        run: python -m pip install -r requirements.txt -c constraints/ci-python311-linux.txt

      - name: Verify dependency compatibility
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q ingestion transformations forecasting fabric/notebooks tests

      - name: Run tests
        run: python -m pytest -q
