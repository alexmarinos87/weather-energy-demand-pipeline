api:
  base_url: "https://connecteddata.nationalgrid.co.uk/api/3/action"
  endpoint: "datastore_search"
  api_key_env: "NATIONAL_GRID_API_TOKEN"
  api_key_header: "Authorization"
  timeout_seconds: 30
  page_size: 1000
  max_records: 50000
  params:
    # Live Data (NGED) - choose the resource for one licence area.
    resource_id: "replace-with-resource-id"
