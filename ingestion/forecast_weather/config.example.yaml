source_area: "east_midlands"
api:
  base_url: "https://api.openweathermap.org/data/2.5"
  units: "metric"
  api_key_env: "OPENWEATHER_API_KEY"
  timeout_seconds: 30
  max_forecast_records: 40
output:
  raw_root: "data/raw/forecast_weather/openweather"
  normalized_root: "data/normalized/forecast_weather/openweather"
